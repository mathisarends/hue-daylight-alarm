[project]
name = "huerise"
version = "2.0.0"
description = "Minimal API for a YAML-configured Philips Hue daylight alarm"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "hueify>=0.8.0",
    "dishka>=1.9.1",
    "pydantic-settings>=2.13.1",
    "pydantic>=2.12.5",
    "fastapi>=0.124.0",
    "uvicorn[standard]>=0.34.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["huerise/tests"]
addopts = "--cov=huerise --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "huerise/tests/*",
    "huerise/app.py",
    "huerise/main.py",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [
    ".venv",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["huerise"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "huerise/**/*.py",
]
exclude = [
    "huerise/tests",
]
