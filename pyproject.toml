[project]
name = "huerise"
version = "0.1.0"
description = "Philips Hue sunrise alarm system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "hueify>=0.6.1",
    "dishka>=1.9.1",
    "pydantic-settings>=2.13.1",
    "sqlmodel>=0.0.27",
    "pydantic>=2.12.5",
    "alembic>=1.18.4",
    "aiosqlite>=0.22.1",
    "fastapi>=0.124.0",
    "uvicorn[standard]>=0.34.0",
    "aioboto3>=15.5.0",
    "tzdata>=2026.3",
    "transitbus>=0.1.0",
]

[project.optional-dependencies]
local = [
    "numpy>=2.4.4",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
]
sonos = [
    "sonosify>=0.3.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=huerise --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "huerise/app.py",
    "huerise/main.py",
    "huerise/lifespan.py",
    "huerise/infrastructure/di/*",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "huerise/**/*.py",
]
