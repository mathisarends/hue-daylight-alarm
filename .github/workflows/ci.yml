name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --group dev ruff check .
      - run: uv run --group dev ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # testcontainers spins up postgres:17-alpine; the runner ships Docker.
      - run: uv run --group dev pytest huerise/tests/

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache: true
      - run: go -C cli test ./...
      - run: go -C cli vet ./...

  generated-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache: true
      - run: uv run python scripts/export_openapi.py
        env:
          AUTH_JWT_SECRET: schema-export-placeholder
      - run: cp openapi.json cli/openapi.json
      - run: go -C cli generate ./internal/generate
      - run: git diff --exit-code -- openapi.json cli/internal/client
