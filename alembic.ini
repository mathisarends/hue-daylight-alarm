[alembic]
script_location = %(here)s/huerise/alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url = postgresql+asyncpg://huerise:huerise@localhost:5432/huerise

[post_write_hooks]
hooks = ruff_lint, ruff_format
ruff_lint.type = module
ruff_lint.module = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
