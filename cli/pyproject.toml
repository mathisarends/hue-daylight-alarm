[project]
name = "huerise-cli"
version = "0.1.0"
description = "Command-line client for the Huerise Alarm API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15.1",
    "rich>=13.9.4",
    "httpx>=0.28.1",
    "attrs>=24.3.0",
    "python-dateutil>=2.9.0.post0",
    "typing-extensions>=4.12.2",
]

[project.scripts]
huerise = "huerise_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huerise_cli"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["src/huerise_cli/generated"]
