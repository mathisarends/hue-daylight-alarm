services:
  minio:
    image: minio/minio:latest
    container_name: daylight-alarm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-huerise}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-huerise-dev-secret}
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-huerise}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-huerise-dev-secret}
      STORAGE_BUCKET_NAME: ${MINIO_BUCKET_NAME:-huerise-assets}
    volumes:
      - ./assets:/assets:ro
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
      mc mb --ignore-existing "local/$${STORAGE_BUCKET_NAME}";
      mc mirror --overwrite /assets "local/$${STORAGE_BUCKET_NAME}";
      '

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: daylight-alarm-migrate
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
      - ./huerise:/app/huerise
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/daylight.db
      - MINIO_ENDPOINT_URL=http://minio:9000
    command: ["python", "-m", "alembic", "upgrade", "head"]

  daylight-alarm:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: daylight-alarm
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
      - ./huerise:/app/huerise
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/daylight.db
      - MINIO_ENDPOINT_URL=http://minio:9000
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  adminer:
    image: adminer
    container_name: daylight-alarm-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - sqlite_data:/data
      - ./adminer/plugins-enabled:/var/www/html/plugins-enabled
    environment:
      - ADMINER_DEFAULT_DRIVER=sqlite
      - ADMINER_DEFAULT_DB=/data/daylight.db

volumes:
  sqlite_data:
  minio_data:
