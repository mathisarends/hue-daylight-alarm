services:
  daylight-alarm:
    build:
      context: .
      dockerfile: huerise/Dockerfile
    container_name: huerise
    restart: unless-stopped
    environment:
      HUERISE_API_KEY: ${HUERISE_API_KEY:?Set HUERISE_API_KEY in .env}
      HUERISE_CONFIG_PATH: /config/huerise.yml
      HUERISE_LOG_LEVEL: ${HUERISE_LOG_LEVEL:-INFO}
      HUE_BRIDGE_IP: ${HUE_BRIDGE_IP:-}
      HUE_APP_KEY: ${HUE_APP_KEY:-}
    ports:
      - "${HUERISE_PORT:-8000}:8000"
    volumes:
      - ./data:/config
