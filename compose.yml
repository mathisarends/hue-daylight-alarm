services:
  postgres:
    image: postgres:17-alpine
    container_name: huerise-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-huerise}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-huerise}
      - POSTGRES_DB=${POSTGRES_DB:-huerise}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huerise} -d ${POSTGRES_DB:-huerise}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: huerise-migrate
    env_file:
      - .env
    volumes:
      - ./huerise:/app/huerise
      - ./alembic.ini:/app/alembic.ini
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-huerise}:${POSTGRES_PASSWORD:-huerise}@postgres:5432/${POSTGRES_DB:-huerise}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]

  daylight-alarm:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: daylight-alarm
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./huerise:/app/huerise
      - ./alembic.ini:/app/alembic.ini
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-huerise}:${POSTGRES_PASSWORD:-huerise}@postgres:5432/${POSTGRES_DB:-huerise}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
